name: APK Loom 构建

on:
  workflow_dispatch:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

concurrency:
  group: apkloom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: android-actions/setup-android@v3
      - name: 安装固定 SDK 工具链
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.13846066' 'cmake;3.31.6'
      - name: 准备签名与版本
        env:
          RELEASE_KEY_B64: ${{ github.ref_type == 'tag' && secrets.KEY_STORE || '' }}
          TAG_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = 'true' ]; then
            test -n "$RELEASE_KEY_B64" || { echo '发布标签缺少 KEY_STORE'; exit 1; }
            version=$(sed -n 's/^apkLoomVersionName=//p' gradle.properties | tr -d '\r')
            test "$TAG_NAME" = "v$version" || { echo '标签与版本名不一致'; exit 1; }
            printf '%s' "$RELEASE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/apkloom-release.jks"
            echo "ANDROID_STORE_FILE=$RUNNER_TEMP/apkloom-release.jks" >> "$GITHUB_ENV"
            echo 'BUILD_SIGNING_ARGS=' >> "$GITHUB_ENV"
          else
            echo 'BUILD_SIGNING_ARGS=-PallowDebugSigning=true' >> "$GITHUB_ENV"
          fi
      - name: 本地测试、兼容检查与产物收集
        env:
          ANDROID_STORE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.KEY_STORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.ref_type == 'tag' && secrets.ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew -PstandaloneWrapper=true $BUILD_SIGNING_ARGS \
            :wrapper-manager:testDebugUnitTest :wrapper-patch:test \
            :patch-loader:testDebugUnitTest :wrapper-manager:lintRelease \
            :patch-loader:lintDebug :wrapper-smoke:assembleDebug \
            :wrapper-smoke:lintDebug :wrapper-manager:collectReleaseArtifacts
      - name: 校验签名与发布摘要
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose \
            wrapper-manager/build/outputs/apk/release/wrapper-manager-release.apk
          for directory in out/releases/*; do (cd "$directory" && sha256sum -c SHA256SUMS.txt); done
      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: apkloom-${{ github.sha }}
          path: out/releases/
          if-no-files-found: error
      - name: 上传测试报告和调试符号
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: apkloom-reports-${{ github.sha }}
          path: |
            wrapper-manager/build/reports/
            wrapper-manager/build/outputs/mapping/
            wrapper-patch/build/reports/
            patch-loader/build/reports/
            patch-loader/build/outputs/mapping/
            patch-loader/build/symbols/
            wrapper-smoke/build/reports/
      - name: 清理临时签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/apkloom-release.jks"
